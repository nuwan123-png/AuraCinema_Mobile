name: auracinema_mobile
description: "AuraCinema - Movies, Drama, Series & Anime Streaming App"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  cached_network_image: ^4.0.7
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  video_player: ^2.9.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - shorebird.yaml

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0F"
  adaptive_icon_foreground: "assets/icon/app_icon.png"